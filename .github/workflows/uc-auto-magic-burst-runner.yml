name: Run staged auto magic burst patch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/uc-auto-magic-burst-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and apply staged patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/uc-auto-magic-burst.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run Lua syntax and focused regressions"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_auto_mb_patch.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_auto_mb_patch.py
      - name: Run Lua syntax and focused regressions
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p uc_magic_burst_auto.lua
          luac5.1 -p uc_combat_extension_config.lua
          luac5.1 -p uc_combat_extensions.lua
          luac5.1 -p uc_config_normalizer.lua
          luac5.1 -p uc_active_config.lua
          lua5.1 tests/replay/harness/selftest_magic_burst_auto_family.lua
          lua5.1 tests/replay/harness/selftest_magic_burst_stepdown.lua
          lua5.1 tests/replay/harness/selftest_magic_burst_offtarget.lua
          lua5.1 tests/replay/harness/selftest_combat_extension_config_schema.lua
      - name: Build WinForms project
        shell: bash
        run: |
          dotnet build UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -p:EnableWindowsTargeting=true
      - name: Commit implementation and clean staging workflows
        shell: bash
        run: |
          rm .github/workflows/uc-auto-magic-burst.yml
          rm .github/workflows/uc-auto-magic-burst-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic magic burst family selection"
          git push origin HEAD:master
