name: Patch Zerde issue 3

on:
  push:
    branches:
      - fix/zerde-run-foil-dispatch-3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zerde-run-foil-dispatch-3
      - name: Apply patch
        run: python3 .github/scripts/patch_zerde_issue3.py
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run focused tests
        run: |
          lua5.1 tests/replay/harness/selftest_run_tank.lua
          lua5.1 tests/replay/harness/selftest_run_foil_dispatch.lua
          lua5.1 tests/replay/harness/selftest_scheduler_dispatcher_phase2.lua
          lua5.1 tests/replay/harness/selftest_command_ownership_static.lua
          lua5.1 tests/replay/harness/selftest_command_ownership_runtime.lua
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add unified_scheduler.lua tests/replay/harness/selftest_run_tank.lua tests/replay/harness/selftest_run_foil_dispatch.lua .github/workflows/pr35-verify.yml
          git commit -m "Fix RUN Foil self spell dispatch"
          git push origin HEAD:fix/zerde-run-foil-dispatch-3
