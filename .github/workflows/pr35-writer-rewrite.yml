name: PR35 narrow writer rewrite

on:
  push:
    branches:
      - feature/reaction-action-sequences

permissions:
  contents: write

jobs:
  rewrite:
    if: contains(github.event.head_commit.message, '[rewrite-writer]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore base writer and apply sequence-only patch
        shell: bash
        run: |
          set -euxo pipefail
          git show 0289702b5934ce5cb61d6f9fa5f8f533a4e492b4:UnifiedCombatWinForms/StructuredProfileV2Writer.cs > UnifiedCombatWinForms/StructuredProfileV2Writer.cs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UnifiedCombatWinForms/StructuredProfileV2Writer.cs')
          s = p.read_text()
          valid = 'response == "move_to_range" || response == "use_action"))'
          if s.count(valid) != 1:
              raise SystemExit(f'valid-response marker count={s.count(valid)}')
          s = s.replace(valid, 'response == "move_to_range" || response == "use_action" || response == "use_sequence"))', 1)

          action_marker = 'serialized.Add("action_name", actionName);'
          if s.count(action_marker) != 1:
              raise SystemExit(f'action-name marker count={s.count(action_marker)}')
          action_pos = s.index(action_marker) + len(action_marker)
          list_marker = 'list.Add(serialized);'
          list_pos = s.find(list_marker, action_pos)
          if list_pos < 0:
              raise SystemExit('list marker not found after use_action block')
          close_pos = s.rfind('}', action_pos, list_pos)
          if close_pos < 0:
              raise SystemExit('use_action closing brace not found')
          insertion = '''
            else if (response == "use_sequence")
            {
                var sequence = ReactionSequenceProfileCodec.ParseRule(rule);
                var steps = new List<object?>(sequence.Steps.Count);
                foreach (var step in sequence.Steps)
                {
                    steps.Add(
                        new StructuredProfileNode()
                            .Add("action_type", step.ActionType)
                            .Add("action_name", step.ActionName)
                            .Add("target", step.Target)
                            .Add("optional", step.Optional)
                    );
                }
                serialized.Add("steps", steps);
            }
'''
          s = s[:close_pos+1] + insertion + s[close_pos+1:]
          p.write_text(s)
          PY
          git rm .github/workflows/pr35-writer-rewrite.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UnifiedCombatWinForms/StructuredProfileV2Writer.cs
          git commit -m "Narrow structured profile sequence serialization"
          git push
