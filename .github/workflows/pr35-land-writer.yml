name: PR35 land narrow writer patch

on:
  push:
    branches:
      - feature/reaction-action-sequences

permissions:
  contents: write

jobs:
  land:
    if: github.event.head_commit.message == 'Land narrow reaction sequence writer serialization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified narrow patch
        run: python3 tools/patch_reaction_sequence_writer.py
      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "UnifiedCombatWinForms/StructuredProfileV2Writer.cs"
      - name: Commit writer and remove temporary patch plumbing
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr35-land-writer.yml
          rm -f .github/workflows/pr35-writer-rewrite.yml
          rm -f tools/patch_reaction_sequence_writer.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UnifiedCombatWinForms/StructuredProfileV2Writer.cs .github/workflows/pr35-land-writer.yml .github/workflows/pr35-writer-rewrite.yml tools/patch_reaction_sequence_writer.py
          git commit -m "Persist reaction sequences to Profile V2"
          git push origin HEAD:feature/reaction-action-sequences
