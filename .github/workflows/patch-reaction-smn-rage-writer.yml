name: Patch reaction SMN Rage writer

on:
  push:
    branches:
      - feature/reaction-smn-rage-hold

permissions:
  contents: write

jobs:
  patch-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reaction-smn-rage-hold
          fetch-depth: 0
      - name: Patch Structured Profile V2 writer
        shell: python
        run: |
          from pathlib import Path

          path = Path("UnifiedCombatWinForms/StructuredProfileV2Writer.cs")
          text = path.read_text(encoding="utf-8")
          marker = 'serialized.Add("hold_smn_rage_until_sequence_complete", true);'
          if marker in text:
              print("writer already patched")
              raise SystemExit(0)

          old = '''            if (ReadBool(rule, "once_per_instance", false))
            {
                if (trigger is not ("ability_window" or "party_action_complete"))
                {
                    throw new InvalidDataException("once_per_instance reactions require ability_window or party_action_complete trigger");
                }
                serialized.Add("once_per_instance", true);
            }
            if (response is "run_away" or "move_to_range")'''
          new = '''            if (ReadBool(rule, "once_per_instance", false))
            {
                if (trigger is not ("ability_window" or "party_action_complete"))
                {
                    throw new InvalidDataException("once_per_instance reactions require ability_window or party_action_complete trigger");
                }
                serialized.Add("once_per_instance", true);
            }
            if (ReadBool(rule, "hold_smn_rage_until_sequence_complete", false))
            {
                if (trigger != "party_action_complete" || response != "use_sequence")
                {
                    throw new InvalidDataException("SMN Rage hold requires party_action_complete/use_sequence");
                }
                if (!ReadBool(rule, "once_per_instance", false))
                {
                    throw new InvalidDataException("SMN Rage hold requires once_per_instance=true");
                }
                serialized.Add("hold_smn_rage_until_sequence_complete", true);
            }
            if (response is "run_away" or "move_to_range")'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one serializer seam, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit writer patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnifiedCombatWinForms/StructuredProfileV2Writer.cs
          git commit -m "Persist SMN Rage hold in Profile V2"
          git push origin HEAD:feature/reaction-smn-rage-hold
