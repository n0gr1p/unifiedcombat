name: Patch reaction SMN Rage writer

on:
  push:
    branches:
      - feature/reaction-smn-rage-hold

permissions:
  contents: write

jobs:
  patch-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reaction-smn-rage-hold
          fetch-depth: 0
      - name: Patch Structured Profile V2 writer
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("UnifiedCombatWinForms/StructuredProfileV2Writer.cs")
          text = path.read_text(encoding="utf-8")
          marker = 'serialized.Add("hold_smn_rage_until_sequence_complete", true);'
          if marker in text:
              print("writer already patched")
              raise SystemExit(0)

          pattern = re.compile(
              r'(?P<indent>\s*)if \(ReadBool\(rule, "once_per_instance", false\)\)\r?\n'
              r'(?P=indent)\{\r?\n'
              r'(?P<body>.*?)'
              r'(?P=indent)\}\r?\n'
              r'(?P=indent)if \(response is "run_away" or "move_to_range"\)',
              re.DOTALL,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one serializer seam, found {len(matches)}")

          match = matches[0]
          indent = match.group('indent')
          original_once = match.group(0).rsplit(
              f'{indent}if (response is "run_away" or "move_to_range")', 1
          )[0]
          block = (
              original_once
              + f'{indent}if (ReadBool(rule, "hold_smn_rage_until_sequence_complete", false))\n'
              + f'{indent}{{\n'
              + f'{indent}    if (trigger != "party_action_complete" || response != "use_sequence")\n'
              + f'{indent}    {{\n'
              + f'{indent}        throw new InvalidDataException("SMN Rage hold requires party_action_complete/use_sequence");\n'
              + f'{indent}    }}\n'
              + f'{indent}    if (!ReadBool(rule, "once_per_instance", false))\n'
              + f'{indent}    {{\n'
              + f'{indent}        throw new InvalidDataException("SMN Rage hold requires once_per_instance=true");\n'
              + f'{indent}    }}\n'
              + f'{indent}    serialized.Add("hold_smn_rage_until_sequence_complete", true);\n'
              + f'{indent}}}\n'
              + f'{indent}if (response is "run_away" or "move_to_range")'
          )
          text = text[:match.start()] + block + text[match.end():]
          path.write_text(text, encoding="utf-8")
      - name: Commit writer patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnifiedCombatWinForms/StructuredProfileV2Writer.cs
          git commit -m "Persist SMN Rage hold in Profile V2"
          git push origin HEAD:feature/reaction-smn-rage-hold
