name: One-shot UC runtime clock migration

on:
  push:
    branches:
      - 'feature/combat-burst-reactions-auto-engage'

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/combat-burst-reactions-auto-engage
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/uc_time_migrate.py

      - name: Commit migration
        shell: bash
        run: |
          rm -f .github/workflows/uc-time-migration.yml tools/uc_time_migrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Standardize runtime clock and fix magic burst timing"
          git push origin HEAD:feature/combat-burst-reactions-auto-engage
