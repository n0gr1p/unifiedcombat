name: Patch Zerde issue 4 priority

on:
  push:
    branches:
      - fix/zerde-tank-priority-4

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zerde-tank-priority-4
      - name: Apply patch
        run: python3 .github/scripts/patch_zerde_issue4_priority.py
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run focused tests
        run: |
          luac5.1 -p uc_provider_tank_enmity.lua
          luac5.1 -p uc_provider_combat.lua
          lua5.1 tests/replay/harness/selftest_tank_configured_ja_starvation.lua
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/scripts/patch_zerde_issue4_priority.py .github/workflows/patch-zerde-issue4-priority.yml
          git add uc_provider_tank_enmity.lua uc_provider_combat.lua tests/replay/harness/selftest_tank_configured_ja_starvation.lua tests/replay/harness/selftest_scheduler_providers_phase3.lua docs/zerde_uc_issue_tracker.md docs/tank_configured_ja_starvation_diagnostic.md
          git commit -m "Fix tank enmity priority inversion"
          git push origin HEAD:fix/zerde-tank-priority-4
