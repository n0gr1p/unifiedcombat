name: Fix RUN tank WinForms build

on:
  push:
    branches:
      - feature/run-tank-automation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[run-build-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/run-tank-automation
      - name: Fix rune list string conversion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('UnifiedCombatWinForms/StructuredProfileV2Writer.cs')
          s = p.read_text(encoding='utf-8')
          old = '            var raw = runes[i].Trim();'
          new = '            var raw = (runes[i]?.ToString() ?? string.Empty).Trim();'
          if old not in s and new not in s:
              raise SystemExit('expected RUN rune conversion anchor not found')
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UnifiedCombatWinForms/StructuredProfileV2Writer.cs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix RUN rune profile serialization [run-build-fixed]'
          git push origin HEAD:feature/run-tank-automation
