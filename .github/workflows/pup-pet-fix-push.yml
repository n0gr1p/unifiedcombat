name: PUP pet commitment push validation

on:
  push:
    branches: [pup-automaton-control]

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pup-automaton-control
          fetch-depth: 0

      - name: Install Lua 5.1 + LuaSocket
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-socket

      - name: Apply exact staged fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pup-pet-combat-commitment-fix.yml').read_text()
          start_marker = "      - name: Apply shared combat commitment fix\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Lua syntax\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('unable to locate staged pet commitment patch script')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/apply-pet-commitment.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-pet-commitment.sh

      - name: Lua syntax
        run: |
          luac5.1 -p \
            uc_combat_commitment.lua \
            uc_provider_combat.lua \
            uc_pet_combat_provider.lua \
            tests/replay/harness/selftest_combat_commitment.lua \
            tests/replay/harness/selftest_pet_combat_provider.lua \
            tests/replay/harness/selftest_smn_cross_provider_integration.lua

      - name: Combat commitment regression
        run: lua5.1 tests/replay/harness/selftest_combat_commitment.lua

      - name: Shared pet combat regression
        run: lua5.1 tests/replay/harness/selftest_pet_combat_provider.lua

      - name: Summoner cross-provider regression
        run: lua5.1 tests/replay/harness/selftest_smn_cross_provider_integration.lua

      - name: Fight leader / camp-pull engage regression
        run: lua5.1 tests/replay/harness/selftest_fight_leader_engage.lua

      - name: Scheduler provider regression
        run: lua5.1 tests/replay/harness/selftest_scheduler_providers_phase3.lua

      - name: Tank engage priority regression
        run: lua5.1 tests/replay/harness/selftest_tank_engage_priority.lua

      - name: PUP automaton behavior regression
        run: lua5.1 tests/replay/harness/selftest_pup_automaton_control.lua

      - name: Pet command infrastructure regression
        run: lua5.1 tests/replay/harness/selftest_pet_command_infrastructure.lua

      - name: Promote validated source
        shell: bash
        run: |
          rm -f \
            .github/workflows/pup-pet-combat-commitment-fix.yml \
            .github/workflows/pup-pet-fix-push.yml \
            .github/pup-pet-fix-trigger.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: gate pet engagement on combat commitment"
          git push origin HEAD:pup-automaton-control
