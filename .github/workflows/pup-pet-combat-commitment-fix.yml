name: PUP pet combat commitment fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  validate-and-promote:
    if: github.head_ref == 'pup-automaton-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Lua 5.1 + LuaSocket
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-socket

      - name: Apply shared combat commitment fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_exact_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} replacements, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          Path('uc_combat_commitment.lua').write_text(r'''local M = {}

local function truthy(value)
	if value == true or value == 1 then
		return true
	end
	if type(value) == 'string' then
		local lowered = value:lower()
		return lowered == 'true' or lowered == 'on' or lowered == '1' or lowered == 'yes'
	end
	return false
end

local function call_build_set(fn)
	if type(fn) ~= 'function' then
		return {}
	end
	local _, set = fn()
	if type(set) ~= 'table' then
		return {}
	end
	return set
end

function M.evaluate(ctx, target, deps)
	ctx = type(ctx) == 'table' and ctx or {}
	target = type(target) == 'table' and target or {}
	deps = type(deps) == 'table' and deps or {}

	local target_id = tonumber(target.id) or 0
	local claim_id = tonumber(target.claim_id) or 0
	if target_id <= 0 then
		return {
			committed = false,
			reason = 'invalid_target',
			claim_id = claim_id,
			claim_check = 'invalid_target',
		}
	end

	local claims_set = type(deps.claims_set) == 'table' and deps.claims_set
		or call_build_set(deps.build_friendly_claims)
	local party_ids = type(deps.party_ids) == 'table' and deps.party_ids
		or (type(deps.build_party_id_set) == 'function' and deps.build_party_id_set() or {})
	if type(party_ids) ~= 'table' then
		party_ids = {}
	end

	local player_engaged = deps.allow_player_engaged == true
		and tonumber(ctx.player and ctx.player.status) == 1
		and tonumber(target.status) == 1
	local party_claimed_ok = claims_set[claim_id] == true
	local camp_pull_order = nil
	if type(deps.camp_pull_order) == 'function' then
		camp_pull_order = deps.camp_pull_order(target, claims_set)
	end
	local camp_pull_ok = camp_pull_order ~= nil
	local prime_unclaimed_ok = false
	if type(deps.prime_unclaimed_party_aggressive_ok) == 'function' then
		prime_unclaimed_ok = deps.prime_unclaimed_party_aggressive_ok(ctx.settings, target, party_ids) == true
	end
	local force_target_id = tonumber(deps.force_target_id) or 0
	local force_leader_engage = force_target_id > 0 and force_target_id == target_id
	local committed = player_engaged or party_claimed_ok or camp_pull_ok or prime_unclaimed_ok or force_leader_engage

	local reason = 'selection_only'
	if player_engaged then
		reason = 'player_engaged'
	elseif party_claimed_ok then
		reason = 'party_claimed'
	elseif camp_pull_ok then
		reason = 'camp_pull'
	elseif prime_unclaimed_ok then
		reason = 'prime_aggressive'
	elseif force_leader_engage then
		reason = 'fight_leader'
	end

	return {
		committed = committed,
		reason = reason,
		claim_id = claim_id,
		player_engaged = player_engaged,
		party_claimed = party_claimed_ok,
		camp_pull_order = camp_pull_order,
		prime_unclaimed = prime_unclaimed_ok,
		force_leader = force_leader_engage,
		claim_check = ('party_claimed=%s,camp_pull=%s,prime_unclaimed=%s,force_leader=%s,claim_id=%d'):format(
			party_claimed_ok and '1' or '0',
			camp_pull_ok and tostring(camp_pull_order) or '0',
			prime_unclaimed_ok and '1' or '0',
			force_leader_engage and '1' or '0',
			claim_id
		),
	}
end

function M.evaluate_runtime(ctx, target, opts)
	ctx = type(ctx) == 'table' and ctx or {}
	opts = type(opts) == 'table' and opts or {}
	local targeting_common = require('uc_targeting_common')
	local camp_pull_registry = require('uc_camp_pull_registry')
	local scheduler_config = require('uc_scheduler_config')
	local runtime_overrides = require('uc_runtime_overrides')
	local fight_leader = require('uc_fight_leader')
	local settings = type(ctx.settings) == 'table' and ctx.settings or {}

	local force_target_id = 0
	if runtime_overrides.fight_leader_enabled(settings) then
		local leader_id = runtime_overrides.fight_leader_id(settings)
		if leader_id > 0 then
			force_target_id = tonumber(fight_leader.leader_target_id(leader_id)) or 0
		end
	end

	local function build_party_id_set()
		local _, set = targeting_common.get_friendly_combat_member_ids()
		return set
	end

	local function prime_unclaimed_party_aggressive_ok(_, mob, party_ids)
		if not truthy(scheduler_config.combat_prime(settings)) then
			return false
		end
		if not mob or (tonumber(mob.claim_id) or 0) ~= 0 then
			return false
		end
		if (tonumber(mob.status) or 0) ~= 1 then
			return false
		end
		return targeting_common.mob_targets_friendly_member(mob, party_ids, tonumber(ctx.now) or 0) == true
	end

	return M.evaluate(ctx, target, {
		build_friendly_claims = targeting_common.build_friendly_claims,
		build_party_id_set = build_party_id_set,
		camp_pull_order = camp_pull_registry.combat_order,
		prime_unclaimed_party_aggressive_ok = prime_unclaimed_party_aggressive_ok,
		force_target_id = force_target_id,
		allow_player_engaged = opts.allow_player_engaged == true,
	})
end

return M
''')

          replace_once(
              'uc_provider_combat.lua',
              "local camp_pull_registry = require('uc_camp_pull_registry')\n\nlocal M = {}\n",
              "local camp_pull_registry = require('uc_camp_pull_registry')\nlocal combat_commitment = require('uc_combat_commitment')\n\nlocal M = {}\n"
          )

          old_policy = '''\t\tlocal _, claims_set = build_friendly_claims()\n\t\tlocal claim_id = tonumber(target.claim_id) or 0\n\t\tlocal party_ids = build_party_id_set()\n\t\tlocal party_claimed_ok = claims_set[claim_id] == true\n\t\tlocal camp_pull_order = camp_pull_registry.combat_order(target, claims_set)\n\t\tlocal camp_pull_ok = camp_pull_order ~= nil\n\t\tlocal prime_unclaimed_ok = prime_unclaimed_party_aggressive_ok(ctx.settings, target, party_ids)\n\t\tlocal force_leader_engage = fight_leader_force_target_id > 0\n\t\t\tand fight_leader_force_target_id == (tonumber(target.id) or 0)\n\t\tlocal claim_check = ('party_claimed=%s,camp_pull=%s,prime_unclaimed=%s,force_leader=%s,claim_id=%d'):format(\n\t\t\tparty_claimed_ok and '1' or '0',\n\t\t\tcamp_pull_ok and tostring(camp_pull_order) or '0',\n\t\t\tprime_unclaimed_ok and '1' or '0',\n\t\t\tforce_leader_engage and '1' or '0',\n\t\t\tclaim_id\n\t\t)\n\t\tif not party_claimed_ok and not camp_pull_ok and not prime_unclaimed_ok and not force_leader_engage then\n'''
          new_policy = '''\t\tlocal commitment = combat_commitment.evaluate(ctx, target, {\n\t\t\tbuild_friendly_claims = build_friendly_claims,\n\t\t\tbuild_party_id_set = build_party_id_set,\n\t\t\tcamp_pull_order = camp_pull_registry.combat_order,\n\t\t\tprime_unclaimed_party_aggressive_ok = prime_unclaimed_party_aggressive_ok,\n\t\t\tforce_target_id = fight_leader_force_target_id,\n\t\t})\n\t\tlocal claim_id = commitment.claim_id\n\t\tlocal force_leader_engage = commitment.force_leader == true\n\t\tlocal claim_check = commitment.claim_check\n\t\tif commitment.committed ~= true then\n'''
          replace_once('uc_provider_combat.lua', old_policy, new_policy)

          replace_once(
              'uc_pet_combat_provider.lua',
              "local pet_combat_state = require('uc_pet_combat_state')\n\nlocal M = {}\n",
              "local pet_combat_state = require('uc_pet_combat_state')\nlocal combat_commitment = require('uc_combat_commitment')\n\nlocal M = {}\n"
          )
          replace_once(
              'uc_pet_combat_provider.lua',
              "\tlocal coordinator_can_attempt = require_function(deps, 'coordinator_can_attempt')\n\tlocal target_is_actionable = require_function(deps, 'target_is_actionable')\n\tlocal state = require_table(deps.state, 'deps.state')\n",
              "\tlocal coordinator_can_attempt = require_function(deps, 'coordinator_can_attempt')\n\tlocal target_is_actionable = require_function(deps, 'target_is_actionable')\n\tlocal combat_commitment_evaluate = deps.combat_commitment_evaluate\n\tif combat_commitment_evaluate == nil then\n\t\tcombat_commitment_evaluate = combat_commitment.evaluate_runtime\n\telseif type(combat_commitment_evaluate) ~= 'function' then\n\t\terror('uc_pet_combat_provider deps.combat_commitment_evaluate must be a function')\n\tend\n\tlocal state = require_table(deps.state, 'deps.state')\n"
          )
          old_observe = '''\t\tlocal valid = ctx.combat_domain_enabled == true\n\t\t\tand ctx.target_present == true\n\t\t\tand target_is_actionable(ctx.target, ctx.now, true)\n\t\t\tand (tonumber(ctx.target.id) or 0) > 0\n\t\tctx.target_valid = valid\n\t\tctx.target_id = 0\n\t\tctx.target_hpp = 0\n\t\tif valid then\n\t\t\tctx.target_id = tonumber(ctx.target.id)\n\t\t\tctx.target_hpp = tonumber(ctx.target.hpp)\n\t\tend\n'''
          new_observe = '''\t\tlocal actionable = ctx.combat_domain_enabled == true\n\t\t\tand ctx.target_present == true\n\t\t\tand target_is_actionable(ctx.target, ctx.now, true)\n\t\t\tand (tonumber(ctx.target.id) or 0) > 0\n\t\tlocal commitment = { committed = false, reason = actionable and 'selection_only' or 'not_actionable' }\n\t\tif actionable then\n\t\t\tcommitment = combat_commitment_evaluate(ctx, ctx.target, { allow_player_engaged = true })\n\t\t\tif type(commitment) ~= 'table' then\n\t\t\t\terror('pet combat commitment evaluator must return a table')\n\t\t\tend\n\t\tend\n\t\tlocal valid = actionable and commitment.committed == true\n\t\tctx.target_combat_committed = valid\n\t\tctx.target_commitment_reason = tostring(commitment.reason or '')\n\t\tctx.target_valid = valid\n\t\tctx.target_id = 0\n\t\tctx.target_hpp = 0\n\t\tif valid then\n\t\t\tctx.target_id = tonumber(ctx.target.id)\n\t\t\tctx.target_hpp = tonumber(ctx.target.hpp)\n\t\tend\n'''
          replace_once('uc_pet_combat_provider.lua', old_observe, new_observe)

          # Make the provider tests explicit about whether combat is committed.
          replace_once(
              'tests/replay/harness/selftest_pet_combat_provider.lua',
              "\t\tcombat_domain_enabled = true,\n\t\tability_recasts_present = true,\n",
              "\t\tcombat_domain_enabled = true,\n\t\tcombat_committed = true,\n\t\tability_recasts_present = true,\n"
          )
          replace_once(
              'tests/replay/harness/selftest_pet_combat_provider.lua',
              "local state = state_module.new()\nlocal provider = provider_module.new({\n",
              "local function commitment_evaluate(ctx)\n\tlocal committed = ctx.combat_committed == true\n\treturn {\n\t\tcommitted = committed,\n\t\treason = committed and 'test_committed' or 'selection_only',\n\t}\nend\n\nlocal state = state_module.new()\nlocal provider = provider_module.new({\n"
          )
          needle = "\ttarget_is_actionable = function(target)\n\t\treturn target.valid_target == true and target.hpp > 0\n\tend,\n"
          replacement = needle + "\tcombat_commitment_evaluate = commitment_evaluate,\n"
          replace_exact_count('tests/replay/harness/selftest_pet_combat_provider.lua', needle, replacement, 3)

          new_test = r'''local function test_selection_only_does_not_start_pet_combat()
	_G.Start_Engine = true
	local local_provider = provider_module.new({
		adapter = adapter,
		state = state_module.new(),
		target_is_actionable = function(target)
			return target.valid_target == true and target.hpp > 0
		end,
		combat_commitment_evaluate = commitment_evaluate,
		coordinator_can_attempt = function()
			return true, '', 0
		end,
	})
	local ctx = context()
	ctx.combat_committed = false
	local_provider.observe_target(ctx)
	local actions = {}
	local_provider.collect(ctx, actions)
	assert_equal(ctx.target_valid, false, 'selected-only target must not be a pet combat target')
	assert_equal(ctx.combat_generation, 0, 'selected-only target must not start combat generation')
	assert_equal(find(actions, 'assault'), nil, 'selected-only target must not trigger Assault')
	assert_equal(find(actions, 'rage'), nil, 'selected-only target must not trigger Rage')

	ctx.combat_committed = true
	ctx.now = 11
	local_provider.observe_target(ctx)
	actions = {}
	local_provider.collect(ctx, actions)
	assert_equal(ctx.combat_generation, 1, 'combat commitment starts combat generation')
	assert_true(find(actions, 'assault') ~= nil, 'committed combat target triggers Assault')
	assert_true(find(actions, 'rage') ~= nil, 'committed combat target permits Rage')
end

'''
          replace_once(
              'tests/replay/harness/selftest_pet_combat_provider.lua',
              "local function test_generation_and_initial_actions()\n",
              new_test + "local function test_generation_and_initial_actions()\n"
          )
          replace_once(
              'tests/replay/harness/selftest_pet_combat_provider.lua',
              "test_generation_and_initial_actions()\n",
              "test_selection_only_does_not_start_pet_combat()\ntest_generation_and_initial_actions()\n"
          )

          replace_once(
              'tests/replay/harness/selftest_smn_cross_provider_integration.lua',
              "\t\tcombat_domain_enabled = true,\n\t\tability_recasts_present = true,\n",
              "\t\tcombat_domain_enabled = true,\n\t\tcombat_committed = true,\n\t\tability_recasts_present = true,\n"
          )
          replace_once(
              'tests/replay/harness/selftest_smn_cross_provider_integration.lua',
              "\ttarget_is_actionable = function(target)\n\t\treturn target.valid_target == true and target.hpp > 0\n\tend,\n\tcoordinator_can_attempt = can_attempt,\n",
              "\ttarget_is_actionable = function(target)\n\t\treturn target.valid_target == true and target.hpp > 0\n\tend,\n\tcombat_commitment_evaluate = function(ctx)\n\t\treturn {\n\t\t\tcommitted = ctx.combat_committed == true,\n\t\t\treason = ctx.combat_committed == true and 'test_committed' or 'selection_only',\n\t\t}\n\tend,\n\tcoordinator_can_attempt = can_attempt,\n"
          )

          Path('tests/replay/harness/selftest_combat_commitment.lua').write_text(r'''package.path = './?.lua;' .. package.path

local commitment = require('uc_combat_commitment')

local function assert_equal(actual, expected, message)
	if actual ~= expected then
		error(('%s: expected %s, got %s'):format(message, tostring(expected), tostring(actual)))
	end
end

local function base_ctx()
	return {
		now = 10,
		settings = {},
		player = { status = 0 },
	}
end

local function base_target()
	return {
		id = 300,
		name = 'Enemy',
		valid_target = true,
		spawn_type = 16,
		hpp = 100,
		status = 0,
		claim_id = 0,
	}
end

local function deps(overrides)
	local d = {
		build_friendly_claims = function()
			return {}, {}
		end,
		build_party_id_set = function()
			return {}
		end,
		camp_pull_order = function()
			return nil
		end,
		prime_unclaimed_party_aggressive_ok = function()
			return false
		end,
		force_target_id = 0,
		allow_player_engaged = true,
	}
	for key, value in pairs(overrides or {}) do
		d[key] = value
	end
	return d
end

local ctx = base_ctx()
local target = base_target()
local result = commitment.evaluate(ctx, target, deps())
assert_equal(result.committed, false, 'mere selection is not combat commitment')
assert_equal(result.reason, 'selection_only', 'selection-only reason')

result = commitment.evaluate(ctx, target, deps({
	build_friendly_claims = function()
		return {}, { [100] = true }
	end,
}))
assert_equal(result.committed, false, 'unclaimed target is not party combat')

target.claim_id = 100
result = commitment.evaluate(ctx, target, deps({
	build_friendly_claims = function()
		return {}, { [100] = true }
	end,
}))
assert_equal(result.committed, true, 'party-claimed target is combat commitment')
assert_equal(result.reason, 'party_claimed', 'party claim reason')

target = base_target()
result = commitment.evaluate(ctx, target, deps({
	camp_pull_order = function()
		return 2
	end,
}))
assert_equal(result.committed, true, 'tracked camp pull is combat commitment')
assert_equal(result.reason, 'camp_pull', 'camp pull reason')

target.status = 1
result = commitment.evaluate(ctx, target, deps({
	prime_unclaimed_party_aggressive_ok = function()
		return true
	end,
}))
assert_equal(result.committed, true, 'Prime-detected aggressor is combat commitment')
assert_equal(result.reason, 'prime_aggressive', 'Prime aggression reason')

target = base_target()
result = commitment.evaluate(ctx, target, deps({ force_target_id = 300 }))
assert_equal(result.committed, true, 'fight-leader target is combat commitment')
assert_equal(result.reason, 'fight_leader', 'fight leader reason')

ctx.player.status = 1
target.status = 1
result = commitment.evaluate(ctx, target, deps())
assert_equal(result.committed, true, 'engaged hostile target covers claim propagation lag')
assert_equal(result.reason, 'player_engaged', 'engaged target reason')

ctx.player.status = 1
target.status = 0
result = commitment.evaluate(ctx, target, deps())
assert_equal(result.committed, false, 'engaged player cursoring a non-combat mob does not commit it')

print('selftest_combat_commitment: OK')
''')

          replace_once(
              'tests/replay/harness/selftest_all_replay_fixtures.lua',
              '    "tests/replay/harness/selftest_pet_command_infrastructure.lua",\n',
              '    "tests/replay/harness/selftest_pet_command_infrastructure.lua",\n    "tests/replay/harness/selftest_combat_commitment.lua",\n'
          )
          PY

      - name: Lua syntax
        run: |
          luac5.1 -p \
            uc_combat_commitment.lua \
            uc_provider_combat.lua \
            uc_pet_combat_provider.lua \
            tests/replay/harness/selftest_combat_commitment.lua \
            tests/replay/harness/selftest_pet_combat_provider.lua \
            tests/replay/harness/selftest_smn_cross_provider_integration.lua

      - name: Combat commitment regression
        run: lua5.1 tests/replay/harness/selftest_combat_commitment.lua

      - name: Shared pet combat regression
        run: lua5.1 tests/replay/harness/selftest_pet_combat_provider.lua

      - name: Summoner cross-provider regression
        run: lua5.1 tests/replay/harness/selftest_smn_cross_provider_integration.lua

      - name: Fight leader / camp-pull engage regression
        run: lua5.1 tests/replay/harness/selftest_fight_leader_engage.lua

      - name: PUP automaton behavior regression
        run: lua5.1 tests/replay/harness/selftest_pup_automaton_control.lua

      - name: Pet command infrastructure regression
        run: lua5.1 tests/replay/harness/selftest_pet_command_infrastructure.lua

      - name: Promote validated fix
        shell: bash
        run: |
          rm .github/workflows/pup-pet-combat-commitment-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: gate pet engagement on combat commitment"
          git push origin HEAD:${{ github.head_ref }}
