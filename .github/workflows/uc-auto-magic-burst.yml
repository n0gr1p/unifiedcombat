local function assert_equal(actual, expected, message)
    if actual ~= expected then
        error(('%s: expected=%s actual=%s'):format(message or 'values differ', tostring(expected), tostring(actual)))
    end
end

local MOCKED = {
    'resources',
    'uc_active_config',
    'uc_reaction_runtime',
    'unified_combat_core',
    'uc_targeting_common',
    'uc_sch_skillchain',
