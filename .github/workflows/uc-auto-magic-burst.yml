              '    spell = "profile_owned_by_ui",\n    spell_active = "profile_owned_by_ui",\n    magic_burst_mode = "profile_owned_by_ui",\n    magic_burst_family = "profile_owned_by_ui",\n    magic_burst_max_tier = "profile_owned_by_ui",'
