name: One-shot UC time scope correction

on:
  push:
    branches:
      - feature/combat-burst-reactions-auto-engage

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/combat-burst-reactions-auto-engage
          fetch-depth: 0

      - name: Apply scope correction
        run: python3 tools/fix_uc_time_scope.py

      - name: Commit correction
        shell: bash
        run: |
          rm -f .github/workflows/uc-time-scope-fix.yml tools/fix_uc_time_scope.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix canonical time helper lexical scope"
          git push origin HEAD:feature/combat-burst-reactions-auto-engage
