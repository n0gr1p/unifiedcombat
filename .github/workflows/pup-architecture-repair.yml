name: PUP architecture repair

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  lua-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconstruct exact repair
        run: |
          cat .github/pup-repair-final/part-* > /tmp/pup-repair.patch.gz
          gunzip -c /tmp/pup-repair.patch.gz > /tmp/pup-repair.patch
          echo "4e69fb668fc2ca2dbf0d2551ffccd4f0552f2bf7953f7722f056fec364ff572f  /tmp/pup-repair.patch" | sha256sum -c -
          git apply --check /tmp/pup-repair.patch
          git apply /tmp/pup-repair.patch
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Lua syntax
        run: >-
          luac5.1 -p
          uc_pup_config.lua
          uc_pup_runtime.lua
          uc_config_normalizer.lua
          uc_active_config.lua
          uc_profile_v2.lua
          uc_profile_contract.lua
          uc_config_runtime.lua
          tests/replay/harness/selftest_pup_profile_v2.lua
          tests/replay/harness/selftest_pup_automaton_control.lua
      - name: PUP profile architecture
        run: lua5.1 tests/replay/harness/selftest_pup_profile_v2.lua
      - name: PUP automaton behavior
        run: lua5.1 tests/replay/harness/selftest_pup_automaton_control.lua
      - name: Config normalizer regression
        run: lua5.1 tests/replay/harness/selftest_config_normalizer.lua
      - name: Profile v2 export regression
        run: lua5.1 tests/replay/harness/selftest_profile_v2_export.lua
      - name: Profile v2 runtime consumers
        run: lua5.1 tests/replay/harness/selftest_profile_v2_runtime_consumers.lua
      - name: Shared pet command regression
        run: lua5.1 tests/replay/harness/selftest_pet_command_infrastructure.lua
      - name: Shared pet combat regression
        run: lua5.1 tests/replay/harness/selftest_pet_combat_provider.lua
      - name: Summoner cross-provider regression
        run: lua5.1 tests/replay/harness/selftest_smn_cross_provider_integration.lua
      - name: No PUP side-channel config
        run: |
          test ! -e data/puppetmaster_config.lua
          ! grep -n "puppetmaster_config.lua\|dofile" uc_pup_runtime.lua
          ! grep -n "File.WriteAllText\|Save + reload selected PUP\|puppetmaster_config.lua" UnifiedCombatWinForms/MainForm.PuppetmasterUi.cs

  winforms-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reconstruct exact repair
        shell: bash
        run: |
          cat .github/pup-repair-final/part-* > "$RUNNER_TEMP/pup-repair.patch.gz"
          gunzip -c "$RUNNER_TEMP/pup-repair.patch.gz" > "$RUNNER_TEMP/pup-repair.patch"
          echo "4e69fb668fc2ca2dbf0d2551ffccd4f0552f2bf7953f7722f056fec364ff572f  $RUNNER_TEMP/pup-repair.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/pup-repair.patch"
          git apply "$RUNNER_TEMP/pup-repair.patch"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build UnifiedCombat WinForms
        run: dotnet build UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --nologo
      - name: Structured profile v2 selftest
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-profile-v2

  promote:
    needs: [lua-validation, winforms-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply validated repair
        run: |
          cat .github/pup-repair-final/part-* > /tmp/pup-repair.patch.gz
          gunzip -c /tmp/pup-repair.patch.gz > /tmp/pup-repair.patch
          echo "4e69fb668fc2ca2dbf0d2551ffccd4f0552f2bf7953f7722f056fec364ff572f  /tmp/pup-repair.patch" | sha256sum -c -
          git apply --check /tmp/pup-repair.patch
          git apply /tmp/pup-repair.patch
          rm -rf .github/pup-repair .github/pup-repair-b64 .github/pup-repair-final
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make PUP automation profile-v2 owned"
          git push origin HEAD:${{ github.head_ref }}
