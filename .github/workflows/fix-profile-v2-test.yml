name: Fix stale profile-v2 contract test

on:
  push:
    branches:
      - feature/run-tank-automation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[profile-test-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/run-tank-automation
      - name: Update stale combat targeting assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs')
          s = p.read_text(encoding='utf-8')
          old = 'new[] { "autotarget", "auto_engage", "prime", "spam", "solo", "manual", "pause_automation_while_weakened" }'
          new = 'new[] { "autotarget", "auto_engage", "ability_allow_unengaged", "prime", "spam", "solo", "manual", "pause_automation_while_weakened" }'
          if old not in s and new not in s:
              raise SystemExit('stale CombatTargetingUiKeys assertion anchor not found')
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix stale profile-v2 targeting assertion [profile-test-fixed]'
          git push origin HEAD:feature/run-tank-automation
