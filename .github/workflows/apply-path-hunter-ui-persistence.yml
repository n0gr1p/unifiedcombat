name: Apply path hunter UI persistence fix

on:
  push:
    branches:
      - fix/path-hunter-recording

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/path-hunter-recording
          fetch-depth: 0

      - name: Apply Hunter working-profile fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('UnifiedCombatWinForms/MainForm.ParityLogic.cs')
          text = p.read_text(encoding='utf-8')
          add_old = "        {\n            _pathHunterRows.Add((NextId(_pathHunterRows), name));\n            RebindPathHunterListUi();\n        }\n\n        Forward(sid, new Dictionary<string, object?> { [\"op\"] = \"path_hunter_add\", [\"name\"] = name });"
          add_new = "        {\n            _pathHunterRows.Add((NextId(_pathHunterRows), name));\n            RebindPathHunterListUi();\n            // Hunter edits are profile-local until explicit Save. Capture immediately\n            // so a subsequent mirror refresh cannot rebuild the list from stale state.\n            CaptureWorkingProfileFromUi(sid);\n        }\n\n        Forward(sid, new Dictionary<string, object?> { [\"op\"] = \"path_hunter_add\", [\"name\"] = name });"
          if text.count(add_old) != 1:
              raise SystemExit(f'expected one Hunter add block, found {text.count(add_old)}')
          text = text.replace(add_old, add_new, 1)

          remove_old = "        {\n            _pathHunterRows.RemoveAt(idx);\n            RebindPathHunterListUi();\n        }\n\n        Forward(sid, new Dictionary<string, object?> { [\"op\"] = \"path_hunter_remove\", [\"index\"] = idx + 1 });"
          remove_new = "        {\n            _pathHunterRows.RemoveAt(idx);\n            RebindPathHunterListUi();\n            // Keep the per-session working profile authoritative for unsaved list edits.\n            CaptureWorkingProfileFromUi(sid);\n        }\n\n        Forward(sid, new Dictionary<string, object?> { [\"op\"] = \"path_hunter_remove\", [\"index\"] = idx + 1 });"
          if text.count(remove_old) != 1:
              raise SystemExit(f'expected one Hunter remove block, found {text.count(remove_old)}')
          text = text.replace(remove_old, remove_new, 1)
          p.write_text(text, encoding='utf-8')

          test = Path('tests/replay/harness/selftest_path_hunter_regressions.lua')
          t = test.read_text(encoding='utf-8')
          marker = "local scheduler = read_file('unified_scheduler.lua')\n"
          guard = "local parity = read_file('UnifiedCombatWinForms/MainForm.ParityLogic.cs')\nlocal add_start = assert(parity:find('private void OnPathHunterAdd()', 1, true))\nlocal remove_start = assert(parity:find('private void OnPathHunterRemove()', add_start, true))\nlocal next_section = assert(parity:find('private static string NormalizeTankEnmityEntry', remove_start, true))\nlocal add_section = parity:sub(add_start, remove_start - 1)\nlocal remove_section = parity:sub(remove_start, next_section - 1)\nassert_true(add_section:find('CaptureWorkingProfileFromUi(sid);', 1, true) ~= nil, 'Hunter add must capture the working profile before a snapshot can erase the local row')\nassert_true(remove_section:find('CaptureWorkingProfileFromUi(sid);', 1, true) ~= nil, 'Hunter remove must capture the working profile before a snapshot can restore the removed row')\n\n"
          if marker not in t:
              raise SystemExit('scheduler marker missing from regression guard')
          if 'Hunter add must capture the working profile' not in t:
              t = t.replace(marker, guard + marker, 1)
              test.write_text(t, encoding='utf-8')
          PY

      - name: Run regression guard
        shell: bash
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y lua5.1 >/dev/null
          lua5.1 tests/replay/harness/selftest_path_hunter_regressions.lua

      - name: Build WinForms
        shell: bash
        run: dotnet build ./UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-path-hunter-ui-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Hunter target UI persistence"
          git push origin HEAD:fix/path-hunter-recording
