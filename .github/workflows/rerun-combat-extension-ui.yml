name: Finish combat extension UI integration

on:
  push:
    branches:
      - feature/combat-burst-reactions-auto-engage
    paths:
      - .github/workflows/rerun-combat-extension-ui.yml

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/combat-burst-reactions-auto-engage
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply corrected source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          wf = Path('.github/workflows/apply-combat-extension-ui.yml').read_text(encoding='utf-8')
          start = wf.index("          from pathlib import Path\n")
          end = wf.index("          PY\n", start)
          script = textwrap.dedent(wf[start:end])

          old = '''replace_once(
              'UnifiedCombatWinForms/MainForm.ProfileStore.cs',
              ''' + "'''" + '''            ["skillchain_target"] = "auto",\\n            ["aftermath_ws"] = "",''' + "'''" + ''',
              ''' + "'''" + '''            ["skillchain_target"] = "auto",\\n            ["magic_burst_enabled"] = false,\\n            ["spell"] = "",\\n            ["aftermath_ws"] = "",''' + "'''" + '''
          )'''
          new = '''replace_once(
              'UnifiedCombatWinForms/MainForm.ProfileStore.cs',
              '            ["aftermath_ws"] = "",',
              '            ["aftermath_ws"] = "",\\n            ["magic_burst_enabled"] = false,\\n            ["spell"] = "",'
          )'''
          if old not in script:
              raise RuntimeError('failed to locate obsolete BuildDefaultProfile patch operation')
          script = script.replace(old, new, 1)

          simple = [
              ("        enabled = true,\\n        autotarget = false,\\n        spam = false,", "            enabled = true,\\n            autotarget = false,\\n            spam = false,"),
              ("        enabled = true,\\n        autotarget = false,\\n        auto_engage = true,\\n        spam = false,", "            enabled = true,\\n            autotarget = false,\\n            auto_engage = true,\\n            spam = false,"),
              ("    spells = {\\n        enabled = false,\\n        configured = '',\\n        dd2_slots = {},\\n    },", "        spells = {\\n            enabled = false,\\n            configured = '',\\n            dd2_slots = {},\\n        },"),
              ("    spells = {\\n        enabled = false,\\n        configured = '',\\n        magic_burst = false,\\n        dd2_slots = {},\\n    },", "        spells = {\\n            enabled = false,\\n            configured = '',\\n            magic_burst = false,\\n            dd2_slots = {},\\n        },"),
              ("        if is_table(nested) and table_has_any(nested, { 'enabled', 'autotarget', 'spam',", "    if is_table(nested) and table_has_any(nested, { 'enabled', 'autotarget', 'spam',"),
              ("        if is_table(nested) and table_has_any(nested, { 'enabled', 'autotarget', 'auto_engage', 'spam',", "    if is_table(nested) and table_has_any(nested, { 'enabled', 'autotarget', 'auto_engage', 'spam',"),
              ("            combat.enabled = normalize_boolean(nested.enabled, combat.enabled)\\n            combat.autotarget", "        combat.enabled = normalize_boolean(nested.enabled, combat.enabled)\\n        combat.autotarget"),
              ("            combat.enabled = normalize_boolean(first_path(source, { path('domain_combat_enabled') }), combat.enabled)\\n            combat.autotarget", "        combat.enabled = normalize_boolean(first_path(source, { path('domain_combat_enabled') }), combat.enabled)\\n        combat.autotarget"),
              ("        if is_table(nested) and table_has_any(nested, { 'enabled', 'configured', 'dd2_slots', 'spell' }) then", "    if is_table(nested) and table_has_any(nested, { 'enabled', 'configured', 'dd2_slots', 'spell' }) then"),
              ("        if is_table(nested) and table_has_any(nested, { 'enabled', 'configured', 'magic_burst', 'dd2_slots', 'spell' }) then", "    if is_table(nested) and table_has_any(nested, { 'enabled', 'configured', 'magic_burst', 'dd2_slots', 'spell' }) then"),
              ("            spells.enabled = normalize_boolean(nested.enabled, spells.enabled)\\n            spells.configured", "        spells.enabled = normalize_boolean(nested.enabled, spells.enabled)\\n        spells.configured"),
              ("            spells.enabled = normalize_boolean(first_path(source, { path('spell_active') }), spells.enabled)\\n            spells.configured", "        spells.enabled = normalize_boolean(first_path(source, { path('spell_active') }), spells.enabled)\\n        spells.configured"),
          ]
          for before, after in simple:
              if before not in script:
                  raise RuntimeError('failed to locate patch anchor: ' + before[:100])
              script = script.replace(before, after, 1)

          script = script.replace("\\n            combat.auto_engage", "\\n        combat.auto_engage")
          script = script.replace("\\n            combat.spam", "\\n        combat.spam")
          script = script.replace("\\n            spells.magic_burst", "\\n        spells.magic_burst")
          script = script.replace("\\n            spells.dd2_slots", "\\n        spells.dd2_slots")

          pattern = re.compile(
              r"(?:replace_once|replace_all)\(\n\s*'tests/replay/harness/selftest_config_normalizer\.lua'.*?\n\s*\)\n",
              re.S,
          )
          script, removed = pattern.subn('', script)
          if removed < 1:
              raise RuntimeError('expected to remove selftest_config_normalizer patch operations')

          Path('apply_patch.py').write_text(script, encoding='utf-8')
          PY
          python apply_patch.py
          python - <<'PY'
          from pathlib import Path
          import re

          tests = Path('UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs')
          text = tests.read_text(encoding='utf-8')
          old = 'HubUiConstants.CombatTargetingUiKeys.SequenceEqual(new[] { "autotarget", "prime", "spam", "solo", "manual", "pause_automation_while_weakened" })'
          new = 'HubUiConstants.CombatTargetingUiKeys.SequenceEqual(new[] { "autotarget", "auto_engage", "prime", "spam", "solo", "manual", "pause_automation_while_weakened" })'
          if text.count(old) != 1:
              raise RuntimeError('expected exactly one combat targeting layout contract')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

          logic = Path('UnifiedCombatWinForms/MainForm.ParityLogic.cs')
          text = logic.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?P<indent>[ \t]*)RefreshKeiSpellOptions\(\);\s*'
              r'RefreshMagicBurstSpellOptions\(\);\s*'
              r'RefreshReactionActionSpellOptions\(\);\s*'
              r'UpdateEncounterUiState\(\);'
          )
          def reorder(match):
              i = match.group('indent')
              return (
                  f'{i}RefreshKeiSpellOptions();\n'
                  f'{i}UpdateEncounterUiState();\n'
                  f'{i}RefreshMagicBurstSpellOptions();\n'
                  f'{i}RefreshReactionActionSpellOptions();'
              )
          text, count = pattern.subn(reorder, text)
          if count < 2:
              raise RuntimeError(f'expected at least two Kei refresh ordering blocks, found {count}')
          logic.write_text(text, encoding='utf-8')
          PY
      - name: Build WinForms
        shell: pwsh
        run: dotnet build .\UnifiedCombatWinForms\UnifiedCombatWinForms.csproj -c Release
      - name: Run Profile V2 selftests
        shell: pwsh
        run: dotnet run --project .\UnifiedCombatWinForms\UnifiedCombatWinForms.csproj -c Release -- --selftest-profile-v2
      - name: Commit verified feature source
        shell: bash
        run: |
          rm -f apply_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnifiedCombatWinForms/HubUiConstants.cs \
                  UnifiedCombatWinForms/MainForm.ParityUi.cs \
                  UnifiedCombatWinForms/MainForm.ParityLogic.cs \
                  UnifiedCombatWinForms/MainForm.ProfileStore.cs \
                  UnifiedCombatWinForms/StructuredProfileV2Writer.cs \
                  UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs \
                  uc_config_normalizer.lua \
                  uc_active_config.lua
          git diff --cached --check
          git commit -m "Expose combat extensions in profile UI"
          git push origin HEAD:feature/combat-burst-reactions-auto-engage
