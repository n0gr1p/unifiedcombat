name: Patch SMN Rage gate facade lookup

on:
  push:
    branches:
      - feature/reaction-smn-rage-hold

permissions:
  contents: write

jobs:
  patch-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reaction-smn-rage-hold
          fetch-depth: 0
      - name: Patch SMN adapter
        shell: python
        run: |
          from pathlib import Path

          path = Path("uc_smn_pet_combat_adapter.lua")
          text = path.read_text(encoding="utf-8")
          text2 = text.replace("local rage_gate = require('uc_reaction_smn_rage_gate')\n", "", 1)
          text2 = text2.replace(
              "local held, hold_reason, hold = rage_gate.should_hold(ctx.target_id)",
              "local held, hold_reason, hold = require('uc_reaction_runtime').smn_rage_should_hold(ctx.target_id)",
              1,
          )
          if text2 == text:
              if "smn_rage_should_hold(ctx.target_id)" in text:
                  print("adapter already patched")
                  raise SystemExit(0)
              raise SystemExit("expected SMN adapter gate seams were not found")
          path.write_text(text2, encoding="utf-8")
      - name: Commit adapter patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uc_smn_pet_combat_adapter.lua
          git commit -m "Resolve SMN Rage gate through reaction facade"
          git push origin HEAD:feature/reaction-smn-rage-hold
