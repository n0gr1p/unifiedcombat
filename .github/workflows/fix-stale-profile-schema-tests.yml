name: Fix stale profile schema tests

on:
  push:
    branches:
      - feature/run-tank-automation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[schema-tests-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/run-tank-automation
      - name: Update stale schema-version assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'AssertEqual(profile["profile_schema_version"]!.GetValue<int>(), 5, "migrated schema version mismatch");':
              'AssertEqual(profile["profile_schema_version"]!.GetValue<int>(), 8, "migrated schema version mismatch");',
              'AssertEqual(profile["profile_schema_version"]!.GetValue<int>(), 5, "Kei migration schema version mismatch");':
              'AssertEqual(profile["profile_schema_version"]!.GetValue<int>(), 8, "Kei migration schema version mismatch");',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
              elif new not in s:
                  raise SystemExit(f'expected assertion anchor not found: {old}')
          if changed:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix stale profile schema assertions [schema-tests-fixed]'
          git push origin HEAD:feature/run-tank-automation
