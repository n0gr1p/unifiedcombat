name: Apply RUN tank patch

on:
  push:
    branches:
      - feature/run-tank-automation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[run-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/run-tank-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded patch
        run: python tools/apply_run_tank_patch.py
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Implement RUN tank automation [run-patch-applied]'
          git push origin HEAD:feature/run-tank-automation
