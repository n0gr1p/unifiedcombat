name: Runtime fingerprint patch

on:
  push:
    branches:
      - fix/runtime-fingerprint

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Add runtime fingerprint patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime fingerprint patch
        run: python3 tools/patch_runtime_fingerprint.py
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Parse changed Lua files
        run: |
          luac5.1 -p UnifiedCombat.lua
          luac5.1 -p unified_engine.lua
          luac5.1 -p unified_scheduler.lua
          luac5.1 -p uc_runtime_bootstrap.lua
          luac5.1 -p tests/replay/harness/selftest_runtime_bootstrap.lua
      - name: Runtime bootstrap self-test
        run: lua5.1 tests/replay/harness/selftest_runtime_bootstrap.lua
      - name: Existing reaction sequence self-tests
        run: |
          lua5.1 tests/replay/harness/selftest_reaction_action_sequence.lua
          lua5.1 tests/replay/harness/selftest_reaction_sequence_command_ownership.lua
      - name: Verify diff scope
        run: |
          set -euo pipefail
          git diff --name-only
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' .github/workflows/pr35-verify.yml UnifiedCombat.lua tests/replay/harness/selftest_runtime_bootstrap.lua uc_runtime_bootstrap.lua unified_engine.lua unified_scheduler.lua | sort)"
      - name: Commit implementation and remove temporary tooling
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-fingerprint-patch.yml tools/patch_runtime_fingerprint.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add UnifiedCombat runtime fingerprinting"
          git push origin HEAD:fix/runtime-fingerprint
