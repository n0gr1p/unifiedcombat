name: Runtime fingerprint patch

on:
  push:
    branches:
      - fix/runtime-fingerprint

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Run runtime fingerprint implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime fingerprint patch
        run: |
          python3 tools/patch_runtime_fingerprint.py
          # Keep this implementation commit runtime-only. The connected GitHub
          # app will clean up temporary workflow/tooling after CI succeeds.
          git checkout -- .github/workflows/pr35-verify.yml
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Parse changed Lua files
        run: |
          luac5.1 -p UnifiedCombat.lua
          luac5.1 -p unified_engine.lua
          luac5.1 -p unified_scheduler.lua
          luac5.1 -p uc_runtime_bootstrap.lua
          luac5.1 -p tests/replay/harness/selftest_runtime_bootstrap.lua
      - name: Runtime bootstrap self-test
        run: lua5.1 tests/replay/harness/selftest_runtime_bootstrap.lua
      - name: Existing reaction sequence self-tests
        run: |
          lua5.1 tests/replay/harness/selftest_reaction_action_sequence.lua
          lua5.1 tests/replay/harness/selftest_reaction_sequence_command_ownership.lua
      - name: Verify diff scope
        run: |
          set -euo pipefail
          actual="$(git status --short | cut -c4- | sort)"
          expected="$(printf '%s\n' UnifiedCombat.lua tests/replay/harness/selftest_runtime_bootstrap.lua uc_runtime_bootstrap.lua unified_engine.lua unified_scheduler.lua | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UnifiedCombat.lua unified_engine.lua unified_scheduler.lua uc_runtime_bootstrap.lua tests/replay/harness/selftest_runtime_bootstrap.lua
          git commit -m "Add UnifiedCombat runtime fingerprinting"
          git push origin HEAD:fix/runtime-fingerprint
