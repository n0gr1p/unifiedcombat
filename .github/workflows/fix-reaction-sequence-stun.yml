name: Fix reaction sequence stun dispatch

on:
  push:
    branches:
      - fix/reaction-sequence-stun-dispatch

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.event.head_commit.message == 'Apply reaction sequence stun dispatch fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply regression patch
        run: python3 tools/patch_reaction_sequence_stun_dispatch.py
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run reaction sequence tests
        run: |
          lua5.1 tests/replay/harness/selftest_reaction_action_sequence.lua
          lua5.1 tests/replay/harness/selftest_reaction_sequence_command_ownership.lua
      - name: Verify diff scope
        run: |
          set -euo pipefail
          git diff --name-only
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' tests/replay/harness/selftest_reaction_action_sequence.lua uc_combat_extensions_sequence.lua uc_reaction_sequence_runtime.lua unified_scheduler.lua | sort)"
      - name: Commit fix and remove temporary tooling
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-reaction-sequence-stun.yml tools/patch_reaction_sequence_stun_dispatch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix atomic reaction Stun dispatch"
          git push origin HEAD:fix/reaction-sequence-stun-dispatch
