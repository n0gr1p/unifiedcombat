          lua5.1 tests/replay/harness/selftest_bard_song_identity_tracking.lua
      - name: No-skillchain target self-test
        run: lua5.1 tests/replay/harness/selftest_no_skillchain_targets.lua
      - name: Scholar configuration self-test
        run: lua5.1 tests/replay/harness/selftest_sch_configuration.lua
      - name: Scholar maintenance self-test
