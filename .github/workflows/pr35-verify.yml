name: UnifiedCombat PR verification

on:
  push:
    branches:
      - master
      - feature/reaction-action-sequences
      - feature/run-tank-automation
      - feature/reaction-once-per-instance
      - feature/reaction-smn-rage-hold
  pull_request:
    branches:
      - master

jobs:
  winforms:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build WinForms
        run: dotnet build UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release
      - name: Full profile v2 self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-profile-v2
      - name: RUN tank profile persistence self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-run-tank-profile
      - name: Reaction sequence persistence self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-reaction-sequence
      - name: Activity profile self-tests
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-activity-profiles

  lua-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Runtime Lua parse self-test
        run: lua5.1 tests/replay/harness/selftest_runtime_parse.lua
      - name: Doom Holy Water staging self-test
        run: lua5.1 tests/replay/harness/selftest_doom_water.lua
      - name: Doom Holy Water integration self-test
        run: lua5.1 tests/replay/harness/selftest_doom_water_integration.lua
      - name: RUN tank self-test
        run: lua5.1 tests/replay/harness/selftest_run_tank.lua
      - name: RUN no-TP mode self-test
        run: lua5.1 tests/replay/harness/selftest_run_no_tp_mode.lua
      - name: RUN Foil dispatch self-test
        run: lua5.1 tests/replay/harness/selftest_run_foil_dispatch.lua
      - name: Config normalizer self-test
        run: lua5.1 tests/replay/harness/selftest_config_normalizer.lua
      - name: Legacy Profile V2 food apply self-test
        run: lua5.1 tests/replay/harness/selftest_profile_v2_legacy_food_apply.lua
      - name: Profile V2 flat-surface guard self-test
        run: lua5.1 tests/replay/harness/selftest_profile_v2_flat_surface_guard.lua
      - name: Profile V2 mixed-shape characterization self-test
        run: lua5.1 tests/replay/harness/selftest_profile_v2_mixed_shape_characterization.lua
      - name: Scheduler canonical context self-test
        run: lua5.1 tests/replay/harness/selftest_scheduler_context.lua
      - name: Scheduler canonical context static self-test
        run: lua5.1 tests/replay/harness/selftest_scheduler_tick_context_static.lua
      - name: Scheduler context utils fixture self-test
        run: lua5.1 tests/replay/harness/selftest_context_utils_fixtures.lua
      - name: Phase 2 canonical leaf self-tests
        run: |
          lua5.1 tests/replay/harness/selftest_food_maintenance.lua
          lua5.1 tests/replay/harness/selftest_recurring_spells.lua
          lua5.1 tests/replay/harness/selftest_defensive_resurrection.lua
          lua5.1 tests/replay/harness/selftest_enemy_debuff_maintenance.lua
          lua5.1 tests/replay/harness/selftest_phase2_canonical_leaf_consumers.lua
          lua5.1 tests/replay/harness/selftest_phase2_canonical_authority.lua
          lua5.1 tests/replay/harness/selftest_raise_accept.lua
          lua5.1 tests/replay/harness/selftest_deathsickness_recovery_hold.lua
          lua5.1 tests/replay/harness/selftest_geo_camp_placement.lua
          lua5.1 tests/replay/harness/selftest_hb_buff_maint_majesty_priority.lua
          lua5.1 tests/replay/harness/selftest_bard_song_identity_tracking.lua
          lua5.1 tests/replay/harness/selftest_active_config_defensive_maintenance_readers.lua
          lua5.1 tests/replay/harness/selftest_profile_v2_runtime_consumers.lua
          lua5.1 tests/replay/harness/selftest_active_config_consumer_migration.lua
      - name: Phase 3 combat enablement canonical-authority self-test
        run: lua5.1 tests/replay/harness/selftest_phase3_combat_enablement_authority.lua
      - name: Phase 3 weaponskill canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase3_weaponskill_authority.lua
          lua5.1 tests/replay/harness/selftest_ws_maintenance_precedence.lua
      - name: Phase 3 abilities canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase3_abilities_authority.lua
          lua5.1 tests/replay/harness/selftest_unengaged_abilities.lua
          lua5.1 tests/replay/harness/selftest_scheduler_ranker.lua
          lua5.1 tests/replay/harness/selftest_ws_maintenance_precedence.lua
      - name: Phase 3 targeting canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase3_targeting_authority.lua
          lua5.1 tests/replay/harness/selftest_add_control_priority_eligibility.lua
      - name: Phase 3 tank-enmity canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase3_tank_enmity_authority.lua
          lua5.1 tests/replay/harness/selftest_tank_pet_enmity_provider.lua
          lua5.1 tests/replay/harness/selftest_run_tank.lua
          lua5.1 tests/replay/harness/selftest_run_no_tp_mode.lua
          lua5.1 tests/replay/harness/selftest_tank_configured_ja_starvation.lua
          lua5.1 tests/replay/harness/selftest_tank_engage_priority.lua
      - name: Phase 3 pulling canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase3_pulling_authority.lua
          lua5.1 tests/replay/harness/selftest_camp_puller.lua
          lua5.1 tests/replay/harness/selftest_camp_puller_policy.lua
          lua5.1 tests/replay/harness/selftest_movement_priority_arbitration.lua
      - name: Phase 3 spacing canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase3_spacing_authority.lua
          lua5.1 tests/replay/harness/selftest_scheduler_movement_facade.lua
          lua5.1 tests/replay/harness/selftest_spacing_cast_movement_lock.lua
      - name: Phase 3 follow canonical-authority self-test
        run: |
