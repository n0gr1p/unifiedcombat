name: PR35 reaction sequence verification

on:
  push:
    branches:
      - feature/reaction-action-sequences
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  winforms:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build WinForms
        run: dotnet build UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release
      - name: Profile v2 self-tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $output = (& dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-profile-v2 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          Write-Output $output
          if ($exitCode -ne 0) {
            $body = "PR35 profile-v2 self-test failure:`n```text`n$output`n```"
            gh pr comment 35 --body $body
            exit $exitCode
          }
      - name: Activity profile self-tests
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-activity-profiles

  lua-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Reaction sequence runtime self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_action_sequence.lua
      - name: Reaction sequence ownership self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_sequence_command_ownership.lua
