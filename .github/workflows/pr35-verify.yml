name: UnifiedCombat PR verification

on:
  push:
    branches:
      - feature/reaction-action-sequences
      - feature/run-tank-automation
      - feature/reaction-once-per-instance
  pull_request:
    branches:
      - master

jobs:
  profile-writer-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reaction-once-per-instance
      - name: Apply once-per-instance Profile V2 persistence patch
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('UnifiedCombatWinForms/StructuredProfileV2Writer.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            var serialized = new StructuredProfileNode()
                .Add("trigger", trigger)
                .Add("name", name)
                .Add("response", response);
'''
          new = '''            var serialized = new StructuredProfileNode()
                .Add("trigger", trigger)
                .Add("name", name)
                .Add("response", response);
            if (ReadOptionalBool(rule, "once_per_instance", false))
            {
                if (trigger != "ability_window")
                {
                    throw new InvalidDataException("once_per_instance reactions require ability_window trigger");
                }
                serialized.Add("once_per_instance", true);
            }
'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('StructuredProfileV2Writer reaction serialization anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- UnifiedCombatWinForms/StructuredProfileV2Writer.cs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnifiedCombatWinForms/StructuredProfileV2Writer.cs
          git commit -m "Persist once-per-instance reaction rules in Profile V2"
          git push origin HEAD:feature/reaction-once-per-instance

  winforms:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build WinForms
        run: dotnet build UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release
      - name: Full profile v2 self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-profile-v2
      - name: RUN tank profile persistence self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-run-tank-profile
      - name: Reaction sequence persistence self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-reaction-sequence
      - name: Activity profile self-tests
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-activity-profiles

  lua-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: RUN tank self-test
        run: lua5.1 tests/replay/harness/selftest_run_tank.lua
      - name: RUN no-TP mode self-test
        run: lua5.1 tests/replay/harness/selftest_run_no_tp_mode.lua
      - name: RUN Foil dispatch self-test
        run: lua5.1 tests/replay/harness/selftest_run_foil_dispatch.lua
      - name: Config normalizer self-test
        run: lua5.1 tests/replay/harness/selftest_config_normalizer.lua
      - name: Tank pet enmity config self-test
        run: lua5.1 tests/replay/harness/selftest_tank_pet_enmity_config.lua
      - name: Tank pet enmity provider self-test
        run: lua5.1 tests/replay/harness/selftest_tank_pet_enmity_provider.lua
      - name: Reaction sequence runtime self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_action_sequence.lua
      - name: Reaction sequence ownership self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_sequence_command_ownership.lua
      - name: Reaction once-per-instance self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_once_per_instance.lua
      - name: Reaction sequence fail-open self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_sequence_fail_open.lua
