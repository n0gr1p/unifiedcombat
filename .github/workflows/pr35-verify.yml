name: PR35 reaction sequence verification

on:
  push:
    branches:
      - feature/reaction-action-sequences
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-writer:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sequence serialization patch once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UnifiedCombatWinForms/StructuredProfileV2Writer.cs')
          s = p.read_text()
          if 'response == "use_sequence"' not in s:
              old = 'response == "move_to_range" || response == "use_action"))'
              if s.count(old) != 1:
                  raise SystemExit('could not locate reaction response validation')
              s = s.replace(old, 'response == "move_to_range" || response == "use_action" || response == "use_sequence"))', 1)
              start = s.find('            else if (response == "use_action")\n')
              if start < 0:
                  raise SystemExit('could not locate use_action branch')
              marker = '            list.Add(serialized);\n'
              pos = s.find(marker, start)
              if pos < 0:
                  raise SystemExit('could not locate reaction list append')
              block = '''            else if (response == "use_sequence")
            {
                var sequence = ReactionSequenceProfileCodec.ParseRule(rule);
                var steps = new List<object?>(sequence.Steps.Count);
                foreach (var step in sequence.Steps)
                {
                    steps.Add(
                        new StructuredProfileNode()
                            .Add("action_type", step.ActionType)
                            .Add("action_name", step.ActionName)
                            .Add("target", step.Target)
                            .Add("optional", step.Optional)
                    );
                }
                serialized.Add("steps", steps);
            }
'''
              s = s[:pos] + block + s[pos:]
              p.write_text(s)
          PY
          git diff --check
          rm -f .github/workflows/pr35-apply-writer.yml .github/workflows/pr35-writer-rewrite.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UnifiedCombatWinForms/StructuredProfileV2Writer.cs .github/workflows
          git commit -m "Serialize reaction sequences in structured profiles"
          git push

  winforms:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build WinForms
        run: dotnet build UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release
      - name: Profile v2 self-tests
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-profile-v2
      - name: Activity profile self-tests
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-activity-profiles

  lua-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Reaction sequence runtime self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_action_sequence.lua
      - name: Reaction sequence ownership self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_sequence_command_ownership.lua
