name: UnifiedCombat PR verification

on:
  push:
    branches:
      - feature/reaction-action-sequences
      - feature/run-tank-automation
      - feature/cor-light-shot-dia-ui
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-cor-light-shot-dia-ui:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cor-light-shot-dia-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cor-light-shot-dia-ui
          fetch-depth: 0
      - name: Apply COR Light Shot Dia UI changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'UnifiedCombatWinForms/HubUiConstants.cs',
              '        "domain_follow_enabled",\n        "path_recording",\n',
              '        "domain_follow_enabled",\n        "cor_light_shot_dia",\n        "path_recording",\n'
          )
          replace_once(
              'UnifiedCombatWinForms/HubUiConstants.cs',
              '        ["domain_follow_enabled"] = "Party-follow domain enabled",\n        ["ability_active"] = "Abilities",\n',
              '        ["domain_follow_enabled"] = "Party-follow domain enabled",\n        ["cor_light_shot_dia"] = "Light Shot active Dia",\n        ["ability_active"] = "Abilities",\n'
          )

          replace_once(
              'UnifiedCombatWinForms/MainForm.ParityUi.cs',
              '        corFlags.Controls.Add(_corLuzafRangeOverride);\n        corRoot.Controls.Add(corFlags);\n',
              '        corFlags.Controls.Add(_corLuzafRangeOverride);\n        corFlags.Controls.Add(CreateGlobalBoolCheckBox("cor_light_shot_dia"));\n        corRoot.Controls.Add(corFlags);\n'
          )

          replace_once(
              'UnifiedCombatWinForms/StructuredProfileV2Writer.cs',
              '                    .Add("luzaf_range_override", ReadBool(flatProfile, "cor_luzaf_range_override", false))\n                    .Add("range_selected", ReadString(flatProfile, "cor_roll_range_selected", ""))\n',
              '                    .Add("luzaf_range_override", ReadBool(flatProfile, "cor_luzaf_range_override", false))\n                    .Add("light_shot_dia", ReadBool(flatProfile, "cor_light_shot_dia", true))\n                    .Add("range_selected", ReadString(flatProfile, "cor_roll_range_selected", ""))\n'
          )

          replace_once(
              'uc_active_config.lua',
              '\t\t\tcandidate.cor_luzaf_range_override = config.maintenance.cor.luzaf_range_override\n\t\t\tcandidate.cor_roll_range_selected = config.maintenance.cor.range_selected\n',
              '\t\t\tcandidate.cor_luzaf_range_override = config.maintenance.cor.luzaf_range_override\n\t\t\tcandidate.cor_light_shot_dia = config.maintenance.cor.light_shot_dia\n\t\t\tcandidate.cor_roll_range_selected = config.maintenance.cor.range_selected\n'
          )

          replace_once(
              'UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs',
              '        AssertTrue(HubUiConstants.CombatTargetingUiKeys.Contains("auto_engage"), "Auto Engage must appear in Combat & Targeting UI");\n',
              '        AssertTrue(HubUiConstants.CombatTargetingUiKeys.Contains("auto_engage"), "Auto Engage must appear in Combat & Targeting UI");\n        AssertTrue(HubUiConstants.BoolKeys.Contains("cor_light_shot_dia"), "COR Light Shot Dia must persist through the shared UI boolean registry");\n'
          )

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source patch needed"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnifiedCombatWinForms/HubUiConstants.cs UnifiedCombatWinForms/MainForm.ParityUi.cs UnifiedCombatWinForms/StructuredProfileV2Writer.cs UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs uc_active_config.lua
          git commit -m "Add COR Light Shot Dia UI toggle"
          git push origin HEAD:feature/cor-light-shot-dia-ui

  winforms:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build WinForms
        run: dotnet build UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release
      # Keep the full repository profile suite in addition to feature-specific coverage.
      - name: Full profile v2 self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-profile-v2
      - name: RUN tank profile persistence self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-run-tank-profile
      - name: Reaction sequence persistence self-test
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-reaction-sequence
      - name: Activity profile self-tests
        run: dotnet run --project UnifiedCombatWinForms/UnifiedCombatWinForms.csproj -c Release --no-build -- --selftest-activity-profiles

  lua-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: RUN tank self-test
        run: lua5.1 tests/replay/harness/selftest_run_tank.lua
      - name: Config normalizer self-test
        run: lua5.1 tests/replay/harness/selftest_config_normalizer.lua
      - name: Reaction sequence runtime self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_action_sequence.lua
      - name: Reaction sequence ownership self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_sequence_command_ownership.lua
