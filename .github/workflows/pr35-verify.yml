      - name: Reaction once-per-instance self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_once_per_instance.lua
      - name: Party action completion reaction self-test
        run: lua5.1 tests/replay/harness/selftest_reaction_party_action_complete.lua
      - name: SMN Rage hold reaction self-test
