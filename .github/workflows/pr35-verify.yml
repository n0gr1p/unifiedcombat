          lua5.1 tests/replay/harness/selftest_sleep_waker.lua
          lua5.1 tests/replay/harness/selftest_combat_commitment.lua
      - name: Phase 4 SMN canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase4_smn_authority.lua
          lua5.1 tests/replay/harness/selftest_summoner_configuration.lua
          lua5.1 tests/replay/harness/selftest_smn_maintenance.lua
          lua5.1 tests/replay/harness/selftest_pet_combat_provider.lua
          lua5.1 tests/replay/harness/selftest_smn_cross_provider_integration.lua
          lua5.1 tests/replay/harness/selftest_smn_replay_fixtures.lua
      - name: Phase 4 PUP canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase4_pup_authority.lua
          lua5.1 tests/replay/harness/selftest_pup_profile_v2.lua
          lua5.1 tests/replay/harness/selftest_pup_automaton_control.lua
      - name: Phase 4 SCH canonical-authority self-test
        run: |
          lua5.1 tests/replay/harness/selftest_phase4_sch_authority.lua
          lua5.1 tests/replay/harness/selftest_sch_configuration.lua
          lua5.1 tests/replay/harness/selftest_sch_maintenance.lua
