          lua5.1 tests/replay/harness/selftest_formation_activation.lua
          lua5.1 tests/replay/harness/selftest_spacing_cast_movement_lock.lua
          lua5.1 tests/replay/harness/selftest_run_no_tp_mode.lua
          lua5.1 tests/replay/harness/selftest_scheduler_defensive_cure_movement_lock.lua
