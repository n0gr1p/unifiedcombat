name: Patch Zerde issue 5 no-start

on:
  push:
    branches:
      - fix/zerde-spell-no-start-timeout-5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zerde-spell-no-start-timeout-5
      - name: Apply patch
        run: |
          sed -i 's/clock = 20.50/clock = 11.50/; s/clock = 21.75/clock = 12.75/' .github/scripts/patch_zerde_issue5_no_start.py
          python3 .github/scripts/patch_zerde_issue5_no_start.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/replay/harness/selftest_action_economy_timeline_logging.lua')
          lines = p.read_text().splitlines()
          hits = 0
          for i, line in enumerate(lines):
              if 'addon_path =' in line:
                  lines[i] = '        addon_path = "./",'
                  hits += 1
          if hits != 1:
              raise SystemExit(f'expected one addon_path line, found {hits}')
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate
        run: |
          luac5.1 -p uc_scheduler_action_state.lua
          luac5.1 -p unified_scheduler.lua
          lua5.1 tests/replay/harness/selftest_action_economy_timeline_logging.lua
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uc_scheduler_action_state.lua unified_scheduler.lua tests/replay/harness/selftest_action_economy_timeline_logging.lua docs/zerde_uc_issue_tracker.md
          git commit -m "Short-circuit spell no-start stalls"
          git push origin HEAD:fix/zerde-spell-no-start-timeout-5
