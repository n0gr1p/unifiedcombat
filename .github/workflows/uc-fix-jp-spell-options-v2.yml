name: One-shot JP spell option fix v2

on:
  push:
    branches:
      - feature/combat-burst-reactions-auto-engage

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/combat-burst-reactions-auto-engage
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/fix_jp_spell_options.py

      - name: Run focused regression
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          lua5.1 tests/replay/harness/selftest_remote_bridge_spell_options.lua
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/uc-fix-jp-spell-options-v2.yml tools/fix_jp_spell_options.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix JP gift spells in UI options"
          git push origin HEAD:feature/combat-burst-reactions-auto-engage
