name: Temporary pet enmity test patch

on:
  push:
    branches:
      - fix/pet-enmity-1-verify

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pet-enmity-1-verify
      - name: Update stale Combat & Targeting assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs')
          text = path.read_text(encoding='utf-8')
          old = 'HubUiConstants.CombatTargetingUiKeys.SequenceEqual(new[] { "autotarget", "auto_engage", "ability_allow_unengaged", "prime", "spam", "solo", "manual", "pause_automation_while_weakened" })'
          new = 'HubUiConstants.CombatTargetingUiKeys.SequenceEqual(new[] { "autotarget", "auto_engage", "ability_allow_unengaged", "tank_enmity_include_pets", "prime", "spam", "solo", "manual", "pause_automation_while_weakened" })'
          if old not in text:
              raise SystemExit('expected stale assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit assertion update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UnifiedCombatWinForms/StructuredProfileV2WriterTests.cs
          git commit -m 'Update pet enmity UI regression contract'
          git push origin HEAD:fix/pet-enmity-1-verify
