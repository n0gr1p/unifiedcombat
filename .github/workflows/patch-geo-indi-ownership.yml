name: Patch GEO Indi ownership

on:
  push:
    branches:
      - fix/zerde-geo-indi-ownership-2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zerde-geo-indi-ownership-2
          fetch-depth: 0
      - name: Patch GEO ownership lifecycle
        shell: python
        run: |
          from pathlib import Path

          path = Path('uc_geo_maintenance.lua')
          text = path.read_text()

          old = '''\tlocal function reset_identity()\n\t\tprovider.state.owned_geo_spell = nil\n\t\tprovider.state.owned_geo_blaze_enhanced = false\n\t\tprovider.state.owned_indi_spell = nil\n\t\tprovider.state.owned_entrust_spell = nil\n\t\tprovider.state.owned_entrust_target_id = 0\n\t\tprovider.state.enemy_target_id = 0\n\t\tprovider.state.ecliptic_luopan_id = 0\n\t\tprovider.state.pending = nil\n\t\tprovider.state.sequence = nil\n\t\tprovider.state.next_retry_at = 0\n\t\tprovider.state.failed_geo_target_id = 0\n\t\tprovider.state.failed_geo_target_until = 0\n\tend\n'''
          new = '''\tlocal function reset_runtime()\n\t\tprovider.state.enemy_target_id = 0\n\t\tprovider.state.ecliptic_luopan_id = 0\n\t\tprovider.state.pending = nil\n\t\tprovider.state.sequence = nil\n\t\tprovider.state.next_retry_at = 0\n\t\tprovider.state.failed_geo_target_id = 0\n\t\tprovider.state.failed_geo_target_until = 0\n\tend\n\n\tlocal function reset_identity()\n\t\tprovider.state.owned_geo_spell = nil\n\t\tprovider.state.owned_geo_blaze_enhanced = false\n\t\tprovider.state.owned_indi_spell = nil\n\t\tprovider.state.owned_entrust_spell = nil\n\t\tprovider.state.owned_entrust_target_id = 0\n\t\treset_runtime()\n\tend\n'''
          if old not in text:
              raise SystemExit('reset_identity block not found')
          text = text.replace(old, new, 1)

          old = '''\t\tif rawget(_G, 'Start_Engine') ~= true then\n\t\t\treset_identity()\n\t\t\tpublish_status('engine_off', '')\n\t\t\treturn\n\t\tend\n\t\tif config.enabled ~= true then\n\t\t\treset_identity()\n\t\t\tpublish_status('disabled', '')\n\t\t\treturn\n\t\tend\n'''
          new = '''\t\tif rawget(_G, 'Start_Engine') ~= true then\n\t\t\treset_runtime()\n\t\t\tpublish_status('engine_off', '')\n\t\t\treturn\n\t\tend\n\t\tif config.enabled ~= true then\n\t\t\treset_runtime()\n\t\t\tpublish_status('disabled', '')\n\t\t\treturn\n\t\tend\n'''
          if old not in text:
              raise SystemExit('engine/config reset block not found')
          text = text.replace(old, new, 1)

          old = '''\tfunction provider.reset(reason)\n\t\treset_identity()\n\t\tprovider.state.bolster_armed = false\n\t\tpublish_status('reset', tostring(reason or 'GEO_RESET'))\n\tend\n'''
          new = '''\tfunction provider.reset(reason)\n\t\tlocal reset_reason = tostring(reason or 'GEO_RESET')\n\t\tif reset_reason == 'GEO_MAINTENANCE_DOMAIN_DISABLED' then\n\t\t\treset_runtime()\n\t\telse\n\t\t\treset_identity()\n\t\tend\n\t\tprovider.state.bolster_armed = false\n\t\tpublish_status('reset', reset_reason)\n\tend\n'''
          if old not in text:
              raise SystemExit('provider.reset block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: GEO Indi ownership regression
        run: lua5.1 tests/replay/harness/selftest_geo_indi_ownership.lua
      - name: Existing GEO maintenance regression
        run: lua5.1 tests/replay/harness/selftest_geo_maintenance.lua
      - name: Existing GEO sequence regression
        run: lua5.1 tests/replay/harness/selftest_geo_sequences.lua
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uc_geo_maintenance.lua
          git commit -m "Preserve GEO effect identity across soft transitions"
          git push origin HEAD:fix/zerde-geo-indi-ownership-2
